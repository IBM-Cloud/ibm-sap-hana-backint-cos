[cloud_storage]
auth_mode = apikey
auth_keypath = ./testdata/apikey.txt
bucket = sabine-cos-wrapper-mtu
#bucket = bucket-source-replication
region = us-east
endpoint_url = https://s3.direct.us-east.cloud-object-storage.appdomain.cloud

[objects]
remove_key_prefix = /usr/sap/BHB/SYS/global/hdb/backint
#additional_key_prefix = /replicate
additional_key_prefix = /mtu2
#object_tags = key1=bine,key2=auchda

[backint]
max_concurrency = 8
recover_max_concurrency = 16
multipart_chunksize = 512MB
timeout_microsecond = 60

[trace]
agent_log_level = debug
