name: Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build hdbbackint
      run: |
        go build -o hdbbackint .

    - name: Run tests
      run: |
        go test ./tests/...
